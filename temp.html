<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporary Image Host</title>
<style>
  body {
    margin: 0;
    padding: 32px 16px;
    background-color: #0F172A;
    color: #F8FAFC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  .card {
    max-width: 680px;
    width: 100%;
    background: #1E293B;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    box-sizing: border-box;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin-top: 0;
    margin-bottom: 16px;
    font-weight: 700;
  }
  .img-wrapper {
    margin: 16px 0;
    background: #020617;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    justify-content: center;
  }
  img {
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    display: block;
  }
  .url-box {
    display: flex;
    gap: 8px;
    margin-top: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    font-size: 14px;
    background: #0F172A;
    border: 1px solid #475569;
    border-radius: 6px;
    color: #38BDF8;
    outline: none;
    font-family: monospace;
  }
  button {
    padding: 10px 18px;
    background: #38BDF8;
    color: #0F172A;
    font-weight: 700;
    font-size: 13px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover {
    background: #7DD3FC;
  }
  .copied-msg {
    color: #4ADE80;
    font-size: 12px;
    margin-top: 8px;
    display: none;
  }
  a.direct-link {
    display: inline-block;
    margin-top: 14px;
    color: #94A3B8;
    font-size: 13px;
    text-decoration: underline;
  }
  a.direct-link:hover {
    color: #F8FAFC;
  }
</style>
</head>
<body>

<div class="card">
  <h1>Image Hosted Successfully</h1>
  
  <div class="img-wrapper">
    <img src="temp.jpg" alt="Uploaded Image">
  </div>

  <div class="url-box">
    <input type="text" id="urlInput" value="https://juveriya.in/temp.jpg" readonly>
    <button onclick="copyUrl()">Copy URL</button>
  </div>
  <div class="copied-msg" id="copiedMsg">✓ Copied to clipboard!</div>

  <div>
    <a class="direct-link" href="https://juveriya.in/temp.jpg" target="_blank" rel="noopener">Open direct image link &rarr;</a>
  </div>
</div>

<script>
function copyUrl() {
  const input = document.getElementById("urlInput");
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(input.value).then(() => {
    const msg = document.getElementById("copiedMsg");
    msg.style.display = "block";
    setTimeout(() => { msg.style.display = "none"; }, 3000);
  });
}
</script>

</body>
</html>
